# Traefik static config. Routers/services live in traefik-dynamic.yml (file provider, no container socket).
# Timeouts 0 for long-lived gRPC/WebSocket streams (see NetBird docs). No ACME email on purpose (nothing personal in
# a public repo): Let's Encrypt expiry notice mails will not arrive, renewal is automatic.
log:
  level: INFO
accessLog: {}
providers:
  file:
    filename: /etc/traefik/dynamic.yml
entryPoints:
  web:
    address: ":80"
    http:
      aliasHeadersStrategy: delete
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      aliasHeadersStrategy: delete
    transport:
      respondingTimeouts:
        readTimeout: 0
        writeTimeout: 0
        idleTimeout: 0
serversTransport:
  forwardingTimeouts:
    responseHeaderTimeout: 0s
    idleConnTimeout: 0s
certificatesResolvers:
  letsencrypt:
    acme:
      storage: /letsencrypt/acme.json
      tlsChallenge: {}
