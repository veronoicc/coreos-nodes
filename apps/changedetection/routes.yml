# Traefik route for changedetection.sapphic.world, mesh only. The whole host goes to authentik-server on coke (service
# `authentik`, apps/authentik/routes.yml): its embedded outpost runs the changedetection.io proxy provider in proxy mode, so it
# handles the login (including /outpost.goauthentik.io/ callbacks) and then proxies to changedetection over authentik.network.
# changedetection's own password stays off and it publishes no port, so this is the only way in.
# See apps/changedetection/README.md.
http:
  routers:
    changedetection:
      rule: Host(`changedetection.sapphic.world`)
      entryPoints: [mesh]
      tls:
        certResolver: letsencrypt-dns
        domains:
          - main: "*.sapphic.world"
      service: authentik
