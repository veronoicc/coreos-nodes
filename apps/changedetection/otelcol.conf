# OpenTelemetry Collector 0.166.0 (core distribution) config, mounted as /etc/otelcol/config.yaml by changedetection-otelcol.container.
# Same shape as apps/uptime-kuma/otelcol.conf. .conf on purpose: Traefik reads every .yml/.yaml/.toml below the apps directory as a route file.
receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: changedetection
          scrape_interval: 60s
          static_configs:
            - targets: ["changedetection-exporter:9123"]
exporters:
  otlp_http:
    # VictoriaMetrics on monitoring.network (apps/monitoring/victoriametrics.container ContainerName; a test checks it).
    metrics_endpoint: http://victoriametrics:8428/opentelemetry/v1/metrics
    headers:
      Authorization: "Basic ${env:VM_BASIC_AUTH}"
service:
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [otlp_http]
