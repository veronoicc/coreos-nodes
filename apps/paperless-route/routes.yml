# Traefik routes for paperless.service.veronoi.cc. Paperless itself runs on coke, which accepts no inbound connections:
# Traefik reaches it over the NetBird mesh at coke's mesh address.
# `paperless` (mesh peers, who resolve the name to ecstasy's mesh IP): the whole app, mesh entrypoint only.
# `paperless-share` (internet): only /share/. paperless-ngx v3.4.2 serves a share link at `^share/(?P<slug>\w+)/?$`
# (src/paperless/urls.py:301, SharedLinkView) and answers with the document itself (no login, no static assets, no redirect
# to another path on success), so PathPrefix(`/share/`) is all a share link needs. Expired/unknown links redirect to the
# login page (/accounts/login/...), which is deliberately not served publicly.
# MESH ADDRESS: the same address is in apps/paperless/paperless.container (PublishPort); a test checks they match.
# See apps/paperless/README.md.
http:
  routers:
    paperless:
      rule: Host(`paperless.service.veronoi.cc`)
      entryPoints: [mesh]
      tls:
        certResolver: letsencrypt-dns
        domains:
          - main: "*.service.veronoi.cc"
      service: paperless
    paperless-share:
      rule: Host(`paperless.service.veronoi.cc`) && PathPrefix(`/share/`)
      entryPoints: [websecure]
      tls:
        certResolver: letsencrypt-dns
        domains:
          - main: "*.service.veronoi.cc"
      service: paperless
  services:
    paperless:
      loadBalancer:
        servers:
          - url: http://100.127.197.215:8000
