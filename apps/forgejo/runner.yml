# Shared by forgejo-runner-1..3. runner-entry.sh fills @UUID@ and @TOKEN@ from the runner's secret and starts the daemon on the result.
# Job Docker access (upstream compose example): TLS dind with shared certs, job containers on the dind host network, so
# `localhost:2376` reaches the daemon and `localhost` is in its certificate.
# ponytail: --memory=2g per job x3 runners can exceed coke's RAM next to Authentik/Paperless/Grafana; lower it or the runner count if coke swaps
log:
  level: info
runner:
  capacity: 1
  timeout: 3h
  envs:
    DOCKER_HOST: tcp://localhost:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  labels:
    - ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-24.04
    - ubuntu-24.04:docker://ghcr.io/catthehacker/ubuntu:act-24.04
    - docker:docker://docker.io/library/node:22-bookworm
cache:
  enabled: true
container:
  network: host
  privileged: false
  options: -v /certs/client:/certs/client:ro --memory=2g --cpus=2
  valid_volumes:
    - /certs/client
  docker_host: "-"
server:
  connections:
    forgejo:
      url: https://git.sapphic.world/
      uuid: "@UUID@"
      token: "@TOKEN@"
