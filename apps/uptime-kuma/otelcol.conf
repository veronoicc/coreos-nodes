# OpenTelemetry Collector 0.166.0 (core distribution) config, mounted as /etc/otelcol/config.yaml by uptime-kuma-otelcol.container.
# .conf on purpose: Traefik on ecstasy reads every .yml/.yaml/.toml below the apps directory as a route file.
# Kuma's /metrics is open only because its own auth is disabled (README.md); before that the scrape gets 401 (up == 0).
receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: uptime-kuma
          scrape_interval: 30s
          static_configs:
            - targets: ["uptime-kuma:3001"]
exporters:
  otlp_http:
    # VictoriaMetrics on coke's mesh address: apps/monitoring/victoriametrics.container PublishPort (a test checks they match).
    metrics_endpoint: http://100.127.197.215:8428/opentelemetry/v1/metrics
    headers:
      Authorization: "Basic ${env:VM_BASIC_AUTH}"
service:
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [otlp_http]
