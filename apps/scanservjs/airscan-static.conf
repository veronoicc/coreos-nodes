# sane-airscan drop-in (mounted as /etc/sane.d/airscan.d/static.conf). The container has no avahi daemon; with discovery on,
# sane-airscan 0.99.35 then lists no scanner at all, not even the static [devices] entry the entrypoint writes from
# AIRSCAN_DEVICES. Verified on coke: `scanimage -L` lists `airscan:e0:HP Smart Tank 580` only with this option.
[options]
discovery = disable
