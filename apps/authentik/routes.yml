# Traefik route for Authentik (auth.sapphic.world), deployed on the node that owns the public IP (ecstasy). Authentik itself runs on
# coke, which accepts no inbound connections: Traefik reaches it over the NetBird mesh at coke's mesh address.
# MESH ADDRESS: it appears twice in this file (service and forward-auth middleware) and once in
# apps/authentik/authentik-server.container (PublishPort); edit all three once after coke joined the mesh (a test checks they
# match). See apps/authentik/README.md.
http:
  routers:
    authentik:
      rule: Host(`auth.sapphic.world`)
      entryPoints: [websecure, mesh]
      tls:
        certResolver: letsencrypt-dns
        domains:
          - main: "*.sapphic.world"
      service: authentik
  services:
    authentik:
      loadBalancer:
        servers:
          - url: http://100.127.197.215:9000
  middlewares:
    # Forward auth through Authentik's embedded outpost (part of authentik-server, path /outpost.goauthentik.io/). Used by
    # apps/uptime-kuma/routes.yml and apps/changedetection/routes.yml; the proxy providers are in uptime-kuma-blueprint.yaml and
    # changedetection-blueprint.yaml. trustForwardHeader passes Traefik's X-Forwarded-Host/-Uri/-Proto on, which the outpost
    # uses to pick the provider and build the redirect.
    authentik-forward-auth:
      forwardAuth:
        address: http://100.127.197.215:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
