# Authentik blueprint: OIDC provider + application for Paperless-ngx (docs: https://docs.paperless-ngx.com/configuration/, PAPERLESS_SOCIALACCOUNT_PROVIDERS).
# Mounted into the worker as /blueprints/custom/paperless.yaml; the client secret is read from the worker's environment
# (secrets/coke/authentik-paperless.env.sops, AUTHENTIK_PAPERLESS_CLIENT_SECRET). The same value is inside
# PAPERLESS_SOCIALACCOUNT_PROVIDERS of secrets/coke/paperless.env.sops (Paperless does not expand variables in that JSON).
version: 1
metadata:
  name: Paperless
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: paperless-provider
    identifiers:
      name: Paperless
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: paperless
      client_secret: !Env AUTHENTIK_PAPERLESS_CLIENT_SECRET
      # Defaults to an empty list: without it every login fails "Invalid grant_type for provider".
      grant_types: [authorization_code, refresh_token]
      # django-allauth's callback: /accounts/oidc/<provider_id>/login/callback/ with provider_id authentik. No logout entry is
      # needed: Paperless sends the browser to the end-session endpoint without post_logout_redirect_uri.
      redirect_uris:
        - matching_mode: strict
          url: https://paperless.service.veronoi.cc/accounts/oidc/authentik/login/callback/
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    identifiers:
      slug: paperless
    attrs:
      name: Paperless
      provider: !KeyOf paperless-provider
      meta_launch_url: https://paperless.service.veronoi.cc
  # Only the group `authentik Admins` may use the application: with a binding present, everyone else is denied.
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, paperless]]
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, authentik Admins]]
