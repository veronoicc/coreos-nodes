# Authentik blueprint: forward-auth proxy provider + application for changedetection.io (changedetection.sapphic.world).
# changedetection.io has no OIDC and its own password stays off, so Authentik's embedded outpost (inside authentik-server)
# is its only login, through Traefik's forwardAuth middleware `authentik-forward-auth` (apps/authentik/routes.yml); the
# routes are in apps/changedetection/routes.yml. Mounted into the worker as /blueprints/custom/changedetection.yaml; nothing secret.
# No outpost entry here: the embedded outpost's providers list is replaced on every apply, so it is owned by
# uptime-kuma-blueprint.yaml, which applies this blueprint first and finds the provider by its name.
version: 1
metadata:
  name: changedetection.io
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: changedetection-provider
    identifiers:
      name: changedetection.io
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://changedetection.sapphic.world
  - model: authentik_core.application
    identifiers:
      slug: changedetection
    attrs:
      name: changedetection.io
      provider: !KeyOf changedetection-provider
      meta_launch_url: https://changedetection.sapphic.world/
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, changedetection]]
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, authentik Admins]]
