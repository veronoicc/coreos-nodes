# Authentik blueprint: forward-auth proxy provider + application for Uptime Kuma (status.sapphic.world). Uptime Kuma has no
# OIDC, so Authentik's embedded outpost (inside authentik-server) authenticates the admin UI through Traefik's forwardAuth
# middleware `authentik-forward-auth` (apps/authentik/routes.yml); the routes are in apps/uptime-kuma/routes.yml.
# Mounted into the worker as /blueprints/custom/uptime-kuma.yaml; nothing secret.
# This file owns the embedded outpost for EVERY forward-auth app: its `providers` list and `config` are REPLACED on every
# apply, so add any future proxy provider or outpost setting here, not in the UI. Other apps' proxy providers live in their
# own blueprint, applied first through an authentik_blueprints.metaapplyblueprint entry and listed by name with !Find
# (changedetection.io: changedetection-blueprint.yaml). `config` is the outpost's full stored config (authentik 2026.8.5) with
# authentik_host fixed: it was saved once as the retired https://auth.veronoi.cc, and the outpost sends browsers to it for login.
version: 1
metadata:
  name: Uptime Kuma
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: uptime-kuma-provider
    identifiers:
      name: Uptime Kuma
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://status.sapphic.world
  - model: authentik_core.application
    identifiers:
      slug: uptime-kuma
    attrs:
      name: Uptime Kuma
      provider: !KeyOf uptime-kuma-provider
      meta_launch_url: https://status.sapphic.world/dashboard
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, uptime-kuma]]
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, authentik Admins]]
  # changedetection.io's provider is declared in changedetection-blueprint.yaml: apply it first so the !Find below resolves.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: changedetection.io
  - model: authentik_outposts.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      providers:
        - !KeyOf uptime-kuma-provider
        - !Find [authentik_providers_proxy.proxyprovider, [name, changedetection.io]]
      config:
        authentik_host: https://auth.sapphic.world
        authentik_host_insecure: false
        authentik_host_browser: ""
        log_level: info
        object_naming_template: ak-outpost-%(name)s
        refresh_interval: minutes=5
        docker_labels: null
        docker_network: null
        docker_map_ports: true
        container_image: null
        kubernetes_replicas: 1
        kubernetes_namespace: default
        kubernetes_json_patches: null
        kubernetes_service_type: ClusterIP
        kubernetes_ingress_path_type: null
        kubernetes_image_pull_secrets: []
        kubernetes_ingress_class_name: null
        kubernetes_disable_x509_strict: false
        kubernetes_disabled_components: []
        kubernetes_ingress_annotations: {}
        kubernetes_ingress_secret_name: authentik-outpost-tls
        kubernetes_httproute_annotations: {}
        kubernetes_httproute_parent_refs: []
