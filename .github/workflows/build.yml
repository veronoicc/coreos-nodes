name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # weekly: pick up newer stable FCOS ISOs
    - cron: "23 4 * * 1"

permissions:
  contents: read

env:
  REPO_URL: ${{ github.server_url }}/${{ github.repository }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      nodes: ${{ steps.nodes.outputs.nodes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Butane --strict and ignition-validate for every node
        run: scripts/build-ign.sh
      - run: scripts/lint.sh
      - id: nodes
        run: echo "nodes=$(python build.py --list)" >> "$GITHUB_OUTPUT"

  build:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.validate.outputs.nodes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: scripts/build-iso.sh "${{ matrix.node }}"
      - uses: actions/upload-artifact@v4
        with:
          name: iso-${{ matrix.node }}
          path: |
            dist/${{ matrix.node }}.iso
            dist/${{ matrix.node }}.iso.sha256
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ign-${{ matrix.node }}
          path: |
            build/${{ matrix.node }}.ign
            build/${{ matrix.node }}.bu
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency: release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: iso-*
          path: dist
          merge-multiple: true
      - name: Upload ISOs to the rolling "latest" release
        run: |
          gh release view latest > /dev/null 2>&1 || gh release create latest \
            --target "$GITHUB_SHA" --title "latest" \
            --notes "Rolling custom installer ISOs. Booting one wipes its node's install disk."
          gh release upload latest dist/* --clobber
          gh release edit latest --notes "Built from ${GITHUB_SHA} on $(date -u +%F). Booting an ISO wipes its node's install disk."

  pages:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency: pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ign-*
          path: build
          merge-multiple: true
      - run: scripts/make-site.sh site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
