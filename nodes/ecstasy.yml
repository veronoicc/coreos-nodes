# Hostname: ecstasy.<node_domain> unless `hostname:` is set here.
# hostname: ecstasy.example.org

# Install target of the custom ISO (coreos-installer --dest-device). Booting
# that ISO WIPES this disk without asking. Must be right for this machine.
device: /dev/sda

# Disk size in GiB (usable, as `lsblk -b` shows divided by 2^30; a "20 GB" plan is
# often less than 20 GiB). Optional: when set, the build fails if root_size_gib
# (config.yml) + boot area + minimum data partition do not fit.
disk_gib: 20

# Apps from apps/ this node runs (everything else is removed; empty or missing = no apps).
apps: [traefik, netbird, authentik-route, paperless-route]

# Extra users on top of config.yml (same shape):
# users:
#   - name: bob
#     sudo: false
#     keys: ["ssh-ed25519 AAAA..."]
