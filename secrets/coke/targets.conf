# Secrets for node coke, rendered by secrets-sync from SOPS-encrypted files in this folder.
# One target per line: <encrypted-file> <destination> <mode> <owner:group|-> <units,comma|->
# Encrypted file names are relative to this folder; the format comes from the name (*.env.sops dotenv,
# *.yaml.sops yaml, ...). A destination is rewritten, and its units restarted, only when its decrypted content
# changed. A listed file that is not in this folder yet is skipped.
# NetBird client setup key (the baked client joins the mesh outbound-only): see apps/authentik/README.md.
netbird.env.sops     /var/data/secrets/netbird.env     0600  root:root  netbird.service
# Authentik secrets (secret key, database password, NetBird OIDC client secret): see apps/authentik/README.md.
# All three units are listed: each is gated on this file (ConditionPathExists) and none restarts by itself.
authentik.env.sops   /var/data/secrets/authentik.env   0600  root:root  authentik-postgres.service,authentik-server.service,authentik-worker.service
# Paperless secrets (secret key, Authentik OIDC client incl. its secret): see apps/paperless/README.md.
paperless.env.sops   /var/data/secrets/paperless.env   0600  root:root  paperless-valkey.service,paperless.service
