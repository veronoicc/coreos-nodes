# Secrets for node coke, rendered by secrets-sync from SOPS-encrypted files in this folder.
# One target per line: <encrypted-file> <destination> <mode> <owner:group|-> <units,comma|->
# Encrypted file names are relative to this folder; the format comes from the name (*.env.sops dotenv,
# *.yaml.sops yaml, ...). A destination is rewritten, and its units restarted, only when its decrypted content
# changed. A listed file that is not in this folder yet is skipped.
# NetBird client setup key (the baked client joins the mesh outbound-only): see apps/authentik/README.md.
netbird.env.sops     /var/data/secrets/netbird.env     0600  root:root  netbird.service
# Authentik secrets (secret key, database password, NetBird OIDC client secret): see apps/authentik/README.md.
# All three units are listed: each is gated on this file (ConditionPathExists) and none restarts by itself.
authentik.env.sops   /var/data/secrets/authentik.env   0600  root:root  authentik-postgres.service,authentik-server.service,authentik-worker.service
# Paperless secrets (secret key, Authentik OIDC client incl. its secret): see apps/paperless/README.md.
paperless.env.sops   /var/data/secrets/paperless.env   0600  root:root  paperless-valkey.service,paperless.service
# Authentik side of the Paperless OIDC client (client secret for the blueprint): see apps/paperless/README.md. Only the worker reads it
# ([Container] EnvironmentFile) and is gated on it (ConditionPathExists), so only the worker restarts.
authentik-paperless.env.sops   /var/data/secrets/authentik-paperless.env   0600  root:root  authentik-worker.service
# Monitoring secrets (TimescaleDB admin password, Grafana's read-only DB password, Grafana admin password, Authentik OIDC client secret): see apps/monitoring/README.md.
monitoring.env.sops   /var/data/secrets/monitoring.env   0600  root:root  timescaledb.service,grafana.service
# Authentik side of the Grafana OIDC client (client secret for the blueprint): see apps/monitoring/README.md. Only the worker reads it
# ([Container] EnvironmentFile) and is gated on it (ConditionPathExists), so only the worker restarts.
authentik-grafana.env.sops   /var/data/secrets/authentik-grafana.env   0600  root:root  authentik-worker.service
# Forgejo secrets (secret key, Authentik OIDC client secret for the login source): see apps/forgejo/README.md.
forgejo.env.sops   /var/data/secrets/forgejo.env   0600  root:root  forgejo.service
# Authentik side of the Forgejo OIDC client (client secret for the blueprint): see apps/forgejo/README.md. Only the worker reads it
# ([Container] EnvironmentFile) and is gated on it (ConditionPathExists), so only the worker restarts.
authentik-forgejo.env.sops   /var/data/secrets/authentik-forgejo.env   0600  root:root  authentik-worker.service
# Shared Actions runner secrets (40 hex each): Forgejo registers the runners from them, the runner units read the same file.
forgejo-runners.env.sops   /var/data/secrets/forgejo-runners.env   0600  root:root  forgejo.service,forgejo-runner-1.service,forgejo-runner-2.service,forgejo-runner-3.service,forgejo-runner-4.service,forgejo-runner-5.service,forgejo-runner-6.service,forgejo-runner-7.service,forgejo-runner-8.service,forgejo-runner-9.service,forgejo-runner-10.service
# Registry login for git.sapphic.world (containers-auth.json, Forgejo user veronoicc): podman reads it on every pull, so no unit restarts. See README "Registry auth".
registry-auth.json.sops   /root/.config/containers/auth.json   0600  root:root  -
