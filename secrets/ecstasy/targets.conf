# Secrets for node ecstasy, rendered by secrets-sync from SOPS-encrypted files in this folder.
# One target per line: <encrypted-file> <destination> <mode> <owner:group|-> <units,comma|->
# Encrypted file names are relative to this folder; the format comes from the name (*.env.sops dotenv,
# *.yaml.sops yaml, *.json.sops json, *.ini.sops ini, anything else binary). A destination is rewritten, and its
# units restarted, only when its decrypted content changed. A listed file that is not in this folder yet is skipped.
netbird.env.sops          /var/data/secrets/netbird.env             0600  root:root  netbird.service
# NetBird backend config (store encryption key, auth secrets): see apps/netbird-backend/README.md.
# All three backend units are listed: each is gated on this file (ConditionPathExists) and none restarts by itself.
netbird-server.yaml.sops  /var/data/netbird-backend/config.yaml     0600  root:root  netbird-server.service,netbird-dashboard.service,netbird-traefik.service
