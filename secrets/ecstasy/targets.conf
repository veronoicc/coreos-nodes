# Secrets for node ecstasy, rendered by secrets-sync from SOPS-encrypted files in this folder.
# One target per line: <encrypted-file> <destination> <mode> <owner:group|-> <units,comma|->
# Encrypted file names are relative to this folder; the format comes from the name (*.env.sops dotenv,
# *.yaml.sops yaml, *.json.sops json, *.ini.sops ini, anything else binary). A destination is rewritten, and its
# units restarted, only when its decrypted content changed. A listed file that is not in this folder yet is skipped.
netbird.env.sops          /var/data/secrets/netbird.env             0600  root:root  netbird.service
# NetBird server config (store encryption key, auth secrets): see apps/netbird/README.md.
# Both server units are listed: each is gated on this file (ConditionPathExists) and none restarts by itself.
netbird-server.yaml.sops  /var/data/netbird-server/config.yaml      0600  root:root  netbird-server.service,netbird-dashboard.service
# Cloudflare API token for Traefik's DNS-01 resolver (CF_DNS_API_TOKEN=...): created by you, see apps/traefik/README.md.
traefik.env.sops          /var/data/secrets/traefik.env              0600  root:root  traefik.service
# Registry login for git.sapphic.world (containers-auth.json, Forgejo user veronoicc): podman reads it on every pull, so no unit restarts. See README "Registry auth".
registry-auth.json.sops   /root/.config/containers/auth.json   0600  root:root  -
# Uptime Kuma's OTel Collector: VM_BASIC_AUTH = base64 of monitoring:<VM_PASSWORD> (same password as secrets/coke/monitoring.env.sops). See apps/uptime-kuma/README.md.
uptime-kuma.env.sops      /var/data/secrets/uptime-kuma.env          0600  root:root  uptime-kuma-otelcol.service
