# Secrets for node ecstasy, rendered by secrets-sync from SOPS-encrypted dotenv files in this folder.
# One target per line: <encrypted-file> <destination> <mode> <owner:group|-> <units,comma|->
# Encrypted file names are relative to this folder. A destination is rewritten, and its units
# restarted, only when its decrypted content changed.
netbird.env.sops  /var/data/secrets/netbird.env  0600  root:root  netbird.service
