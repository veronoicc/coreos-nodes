# secrets-sync manifest: one target per line, whitespace separated.
#   <template in this dir>  <destination (absolute)>  <mode>  <owner:group, or - to keep>  <units to restart, comma separated, or ->
# A destination is rewritten, and its units restarted, only when its rendered content changed.
netbird.env.tpl  /var/data/secrets/netbird.env  0600  root:root  netbird.service
